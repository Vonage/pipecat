name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      gitref:
        type: string
        description: 'Branch, tag, or commit to build (e.g., main, feature/xyz)'
        required: true
        default: 'main'
  push:
    branches:
      - main

jobs:
  build-and-publish:
    name: 'Build and publish to GitHub Packages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.gitref || github.ref }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install development dependencies
        run: uv sync --group dev
      
      - name: Build project
        run: uv build --wheel
      
      - name: Get version
        id: get_version
        run: |
          # Extract version from built wheel filename
          WHEEL_FILE=$(ls dist/*.whl | head -n 1)
          VERSION=$(basename $WHEEL_FILE | sed -E 's/pipecat_ai-([^-]+)-.*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipecat-wheels-${{ steps.get_version.outputs.version }}-${{ github.sha }}
          path: ./dist
          retention-days: 90
      
      - name: Publish to GitHub Packages
        run: |
          uv pip install twine
          twine upload --repository-url https://pypi.pkg.github.com/${{ github.repository_owner }}/ dist/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
