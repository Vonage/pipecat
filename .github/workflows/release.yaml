name: release

on:
  workflow_dispatch:
    inputs:
      gitref:
        type: string
        description: 'Branch, tag, or commit to build'
        required: true
        default: 'main'
  push:
    branches:
      - main

env:
  PIPECAT_VERSION: "0.0.85"

jobs:
  release:
    name: 'Build and release wheel'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.gitref || github.ref }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install development dependencies
        run: uv sync --group dev
      
      - name: Build project
        run: uv build --wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ env.PIPECAT_VERSION }}
      
      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipecat-wheel-${{ github.run_number }}-${{ github.sha }}
          path: ./dist
          retention-days: 90
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          name: Vonage/pipecat Latest Build
          body: |
            Latest automated build of Vonage/pipecat
            
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Run:** #${{ github.run_number }}
            
            ## Installation
            
            ```bash
            pip install https://github.com/${{ github.repository }}/releases/download/latest-build/pipecat_ai-${{ env.PIPECAT_VERSION }}-py3-none-any.whl
            ```
          files: dist/*.whl
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
